name: Release APK

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            KEYSTORE_PATH="${{ runner.temp }}/release-keystore.jks"
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            echo "KEYSTORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not configured; building an unsigned release APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests & build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PversionName="${{ steps.version.outputs.name }}" --no-daemon

      - name: Prepare release assets
        id: assets
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          RELEASE_DIR="app/build/outputs/apk/release"
          mkdir -p release-assets

          if [ -f "${RELEASE_DIR}/app-release.apk" ]; then
            APK_SRC="${RELEASE_DIR}/app-release.apk"
            APK_NAME="app-oops-${VERSION_NAME}.apk"
          elif [ -f "${RELEASE_DIR}/app-release-unsigned.apk" ]; then
            APK_SRC="${RELEASE_DIR}/app-release-unsigned.apk"
            APK_NAME="app-oops-${VERSION_NAME}-unsigned.apk"
          else
            echo "No release APK found in ${RELEASE_DIR}"
            ls -la "${RELEASE_DIR}" || true
            exit 1
          fi

          cp "${APK_SRC}" "release-assets/${APK_NAME}"
          (cd release-assets && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          echo "apk_path=release-assets/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_path=release-assets/${APK_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "App Oops ${{ steps.version.outputs.tag }}"
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.apk_path }}
            ${{ steps.assets.outputs.sha_path }}
